<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Veille Juridique</title>
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veille Pro">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Veille Juridique","short_name":"Veille Pro","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#090d16","icons":[{"src":"data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23090d16%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%2338bdf8%22 font-family=%22sans-serif%22 font-weight=%22bold%22>V</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --border-light: #f1f5f9;
      --text: #0f172a; --text-body: #475569; --text-muted: #64748b; --hover-bg: #f1f5f9;
      --accent: #0284c7; --crit-bg: #fef2f2; --crit-text: #dc2626;
      --imp-bg: #fffbeb; --imp-text: #b45309; --read-bg: #ecfdf5; --read-text: #059669;
    }
    html.dark {
      --bg: #090d16; --card: #111827; --border: #1e293b; --border-light: #1e293b;
      --text: #f1f5f9; --text-body: #cbd5e1; --text-muted: #94a3b8; --hover-bg: #1e293b;
      --accent: #38bdf8; --crit-bg: rgba(220,38,38,.16); --crit-text: #f87171;
      --imp-bg: rgba(217,119,6,.16); --imp-text: #fbbf24; --read-bg: rgba(16,185,129,.15); --read-text: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); padding-bottom: 64px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    }
    button, input, select { font-family: inherit; }
    button { background: none; border: none; cursor: pointer; color: inherit; }
    header {
      position: sticky; top: 0; z-index: 30; color: #fff;
      background: rgba(9,13,22,.96); backdrop-filter: blur(10px); border-bottom: 1px solid #1e293b;
    }
    .container { max-width: 680px; margin: 0 auto; padding: 0 16px; }
    .header-top { height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: #38bdf8; flex-shrink: 0; }
    .brand h1 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge-count { font-size: 11px; font-weight: 600; background: #1e293b; color: #cbd5e1; padding: 2px 8px; border-radius: 999px; }
    .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      position: relative; padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
      color: #cbd5e1; display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: #1e293b; }
    .icon-btn.active-sky { background: rgba(56,189,248,.18); color: #38bdf8; }
    .icon-btn.active-amber { background: rgba(251,191,36,.18); color: #fbbf24; }
    .notif-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #38bdf8; }
    .drawer { padding: 6px 0 12px; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 8px; }
    .drawer input, .drawer select {
      width: 100%; background: #111827; color: #f8fafc; border: 1px solid #1e293b;
      border-radius: 8px; padding: 8px 11px; font-size: 13px; outline: none;
    }
    .drawer input:focus, .drawer select:focus { border-color: #38bdf8; }
    .drawer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pills-bar { display: flex; align-items: center; gap: 6px; padding: 2px 0 10px; overflow-x: auto; scrollbar-width: none; }
    .pills-bar::-webkit-scrollbar { display: none; }
    .pill {
      flex-shrink: 0; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
      background: #111827; color: #94a3b8; border: 1px solid #1e293b; display: inline-flex; align-items: center; gap: 6px;
    }
    .pill.active { background: #fff; color: #090d16; border-color: #fff; font-weight: 600; }
    .pill-sep { width: 1px; height: 16px; background: #1e293b; flex-shrink: 0; margin: 0 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    main { padding-top: 16px; }
    .status-bar { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); margin-bottom: 12px; }
    .reset-link { color: var(--accent); font-weight: 600; font-size: 11.5px; }
    .cards-list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .card.is-read { opacity: .55; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .meta-left { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); min-width: 0; }
    .meta-cat { font-weight: 600; color: var(--text); white-space: nowrap; }
    .meta-src { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-date { white-space: nowrap; flex-shrink: 0; }
    .tag-impact { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
    .tag-critique { background: var(--crit-bg); color: var(--crit-text); }
    .tag-important { background: var(--imp-bg); color: var(--imp-text); }
    .card-title { font-size: 15.5px; font-weight: 600; line-height: 1.38; margin-bottom: 8px; }
    .card-title a { color: var(--text); text-decoration: none; }
    .card-title a:hover { color: var(--accent); }
    .card-summary { font-size: 13.5px; line-height: 1.55; color: var(--text-body); margin-bottom: 12px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border-light); }
    .source-link { font-size: 12px; font-weight: 500; color: var(--text-muted); text-decoration: none; }
    .card-actions { display: flex; align-items: center; gap: 4px; }
    .btn-read { padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 500; color: var(--text-muted); }
    .btn-read:hover { background: var(--hover-bg); color: var(--text); }
    .btn-read.done { background: var(--read-bg); color: var(--read-text); }
    .btn-save { padding: 5px; border-radius: 7px; color: var(--text-muted); display: inline-flex; }
    .btn-save.saved { color: #f59e0b; }
    .empty-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 36px 20px; text-align: center; color: var(--text-muted); font-size: 13.5px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-top">
        <div class="brand">
          <span class="brand-dot"></span>
          <h1>Veille Réglementaire</h1>
          <span id="unread-badge" class="badge-count">0</span>
        </div>
        <div class="header-actions">
          <button id="btn-unread" class="icon-btn" onclick="toggleQuickFilter('unreadOnly')">Non lus</button>
          <button id="btn-saved" class="icon-btn" onclick="toggleQuickFilter('savedOnly')" title="Favoris">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
          </button>
          <button id="btn-theme" class="icon-btn" onclick="toggleTheme()" title="Thème"><span id="theme-icon">🌙</span></button>
          <button id="btn-drawer" class="icon-btn" onclick="toggleDrawer()" title="Rechercher">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <span id="drawer-dot" class="notif-dot hidden"></span>
          </button>
        </div>
      </div>
      <div id="filter-drawer" class="drawer hidden">
        <input type="text" id="search-input" oninput="applyFilters()"
