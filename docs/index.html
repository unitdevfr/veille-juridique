<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veille Juridique</title>

  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Veille Pro">

  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Veille Juridique & Réglementaire",
    "short_name": "Veille Pro",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#f8fafc",
    "theme_color": "#0f172a",
    "icons": [{
      "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230f172a%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%2338bdf8%22 font-family=%22sans-serif%22 font-weight=%22bold%22>V</text></svg>",
      "sizes": "512x512",
      "type": "image/svg+xml"
    }]
  }'>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 font-sans antialiased pb-16">

  <!-- EN-TÊTE COMPACT -->
  <header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md text-white border-b border-slate-800">
    <div class="max-w-2xl mx-auto px-4">
      
      <!-- Ligne 1 : Titre + Icônes d'action -->
      <div class="h-14 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-400 shrink-0"></span>
          <h1 class="text-[16px] font-semibold tracking-tight truncate">Veille Réglementaire</h1>
          <span id="unread-badge" class="text-[11px] font-medium bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">0</span>
        </div>

        <div class="flex items-center gap-1">
          <!-- Filtre Non lus -->
          <button id="btn-unread" onclick="toggleQuickFilter('unreadOnly')"
            class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition">
            Non lus
          </button>

          <!-- Filtre Favoris -->
          <button id="btn-saved" onclick="toggleQuickFilter('savedOnly')"
            class="p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Favoris">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
            </svg>
          </button>

          <!-- Bouton Recherche & Filtres avancés (repliable) -->
          <button id="btn-drawer" onclick="toggleDrawer()"
            class="relative p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Rechercher et filtrer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <span id="drawer-dot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-sky-400"></span>
          </button>
        </div>
      </div>

      <!-- Panneau repliable : Recherche + Source + Période -->
      <div id="filter-drawer" class="hidden pb-3 pt-1 space-y-2 border-t border-slate-800/80">
        <input type="text" id="search-input" oninput="applyFilters()" placeholder="Filtrer par mot-clé..."
          class="w-full bg-slate-900 text-sm text-white placeholder-slate-500 rounded-lg px-3 py-2 border border-slate-800 focus:outline-none focus:border-sky-500">
        
        <div class="grid grid-cols-2 gap-2">
          <select id="source-filter" onchange="applyFilters()"
            class="bg-slate-900 text-xs text-slate-300 rounded-lg px-2.5 py-2 border border-slate-800 focus:outline-none focus:border-sky-500 truncate">
            <option value="ALL">Toutes les sources</option>
          </select>

          <select id="period-filter" onchange="applyFilters()"
            class="bg-slate-900 text-xs text-slate-300 rounded-lg px-2.5 py-2 border border-slate-800 focus:outline-none focus:border-sky-500">
            <option value="ALL">Toute période</option>
            <option value="24H">Dernières 24h</option>
            <option value="7D">7 derniers jours</option>
          </select>
        </div>
      </div>

      <!-- Ligne 2 : Pilules Impact & Catégories sur une seule ligne fluide -->
      <div id="pills-bar" class="pb-2.5 pt-0.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
      </div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="max-w-2xl mx-auto px-4 pt-4">
    <div class="flex items-center justify-between text-[11px] text-slate-400 mb-3 px-0.5">
      <span id="results-count">Chargement...</span>
      <button onclick="resetAllFilters()" id="reset-btn" class="hidden text-sky-600 font-medium hover:underline">
        Tout effacer
      </button>
    </div>

    <div id="articles-container" class="space-y-3">
    </div>
  </main>

  <script>
    const CATEGORIES = {
      PDP: { label: "Données (PDP)", dot: "bg-blue-500" },
      CYBER: { label: "Cybersécurité", dot: "bg-red-500" },
      ANTICOR: { label: "Anticorruption", dot: "bg-amber-500" },
      PI: { label: "Propriété Intel.", dot: "bg-emerald-500" },
      COSMETIQUE: { label: "Cosmétique", dot: "bg-pink-500" },
      INSTITUTIONNEL: { label: "Institutionnel", dot: "bg-indigo-500" },
      AUTRE: { label: "Autres", dot: "bg-slate-400" }
    };

    let allArticles = [];
    let state = {
      category: "ALL",
      impact: "ALL",
      unreadOnly: false,
      savedOnly: false,
      drawerOpen: false,
      readIds: JSON.parse(localStorage.getItem("vj_read_ids") || "[]"),
      savedIds: JSON.parse(localStorage.getItem("vj_saved_ids") || "[]")
    };

    const DEMO_ARTICLES = [
      {
        title: "Directive NIS 2 : calendrier de transposition et obligations de notification des incidents majeurs",
        link: "https://www.ssi.gouv.fr",
        source: "ANSSI (CERT-FR)",
        category: "CYBER",
        impact: "CRITIQUE",
        summary: "L'ANSSI détaille le mécanisme de signalement en deux étapes (alerte précoce sous 24h puis rapport circonstancié sous 72h) applicable aux entités essentielles et importantes.",
        pub_date: new Date(Date.now() - 2 * 3600 * 1000).toISOString()
      },
      {
        title: "Nouvelles recommandations sur la sécurisation des API et le chiffrement des données de santé",
        link: "https://www.cnil.fr",
        source: "CNIL",
        category: "PDP",
        impact: "IMPORTANT",
        summary: "La CNIL précise les mesures techniques obligatoires pour l'authentification forte et le cloisonnement des bases hébergeant des données sensibles.",
        pub_date: new Date(Date.now() - 6 * 3600 * 1000).toISOString()
      },
      {
        title: "Bilan annuel des dépôts de brevets et dessins industriels en Europe",
        link: "https://www.inpi.fr",
        source: "INPI",
        category: "PI",
        impact: "INFORMATIF",
        summary: "Publication des statistiques annuelles sur l'innovation industrielle et la répartition sectorielle des titres déposés.",
        pub_date: new Date(Date.now() - 26 * 3600 * 1000).toISOString()
      }
    ];

    async function loadArticles() {
      try {
        const response = await fetch("./articles.json?t=" + Date.now());
        if (!response.ok) throw new Error("Absent");
        const data = await response.json();
        allArticles = Array.isArray(data) && data.length > 0 ? data : DEMO_ARTICLES;
      } catch (err) {
        allArticles = DEMO_ARTICLES;
      }

      populateSourcesDropdown();
      renderPillsBar();
      applyFilters();
    }

    function populateSourcesDropdown() {
      const select = document.getElementById("source-filter");
      const sources = [...new Set(allArticles.map(a => a.source))].sort();
      sources.forEach(src => {
        const opt = document.createElement("option");
        opt.value = src;
        opt.textContent = src;
        select.appendChild(opt);
      });
    }

    function toggleDrawer() {
      state.drawerOpen = !state.drawerOpen;
      document.getElementById("filter-drawer").classList.toggle("hidden", !state.drawerOpen);
      document.getElementById("btn-drawer").classList.toggle("bg-slate-800", state.drawerOpen);
      if (state.drawerOpen) {
        document.getElementById("search-input").focus();
      }
    }

    function toggleQuickFilter(key) {
      state[key] = !state[key];
      const btnUnread = document.getElementById("btn-unread");
      const btnSaved = document.getElementById("btn-saved");

      btnUnread.className = state.unreadOnly
        ? "px-2.5 py-1.5 rounded-lg text-xs font-medium bg-sky-500/20 text-sky-300 transition"
        : "px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition";

      btnSaved.className = state.savedOnly
        ? "p-2 rounded-lg bg-amber-500/20 text-amber-300 transition"
        : "p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition";

      applyFilters();
    }

    function renderPillsBar() {
      const bar = document.getElementById("pills-bar");
      bar.innerHTML = "";

      const makePill = (label, isActive, onClick, dotClass = null) => {
        const btn = document.createElement("button");
        btn.onclick = onClick;
        btn.className = `shrink-0 px-3 py-1 rounded-full text-xs font-medium transition flex items-center gap-1.5 ${
          isActive
            ? "bg-white text-slate-950 shadow-sm"
            : "bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800"
        }`;
        btn.innerHTML = `${dotClass ? `<span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>` : ""}<span>${label}</span>`;
        bar.appendChild(btn);
      };

      // Pilule "Tout"
      makePill("Tout", state.category === "ALL" && state.impact === "ALL", () => {
        state.category = "ALL";
        state.impact = "ALL";
        renderPillsBar();
        applyFilters();
      });

      // Pilules Impact (uniquement si des articles existent pour ce niveau)
      const critCount = allArticles.filter(a => (a.impact || "").toUpperCase() === "CRITIQUE").length;
      if (critCount > 0) {
        makePill(`Critique (${critCount})`, state.impact === "CRITIQUE", () => {
          state.impact = state.impact === "CRITIQUE" ? "ALL" : "CRITIQUE";
          renderPillsBar();
          applyFilters();
        }, "bg-red-500");
      }

      const impCount = allArticles.filter(a => (a.impact || "").toUpperCase() === "IMPORTANT").length;
      if (impCount > 0) {
        makePill(`Important (${impCount})`, state.impact === "IMPORTANT", () => {
          state.impact = state.impact === "IMPORTANT" ? "ALL" : "IMPORTANT";
          renderPillsBar();
          applyFilters();
        }, "bg-amber-400");
      }

      // Séparateur discret
      const sep = document.createElement("span");
      sep.className = "h-4 w-px bg-slate-800 shrink-0 mx-0.5";
      bar.appendChild(sep);

      // Pilules Catégories
      Object.entries(CATEGORIES).forEach(([key, meta]) => {
        const count = allArticles.filter(a => a.category === key).length;
        if (count === 0) return;

        makePill(meta.label, state.category === key, () => {
          state.category = state.category === key ? "ALL" : key;
          renderPillsBar();
          applyFilters();
        }, meta.dot);
      });
    }

    function resetAllFilters() {
      state.category = "ALL";
      state.impact = "ALL";
      state.unreadOnly = false;
      state.savedOnly = false;
      document.getElementById("search-input").value = "";
      document.getElementById("source-filter").value = "ALL";
      document.getElementById("period-filter").value = "ALL";
      document.getElementById("btn-unread").className = "px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition";
      document.getElementById("btn-saved").className = "p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition";
      renderPillsBar();
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById("search-input").value.toLowerCase().trim();
      const sourceFilter = document.getElementById("source-filter").value;
      const periodFilter = document.getElementById("period-filter").value;
      const now = Date.now();

      const totalUnread = allArticles.filter(a => !state.readIds.includes(a.link)).length;
      document.getElementById("unread-badge").textContent = totalUnread;

      // Pastille sur l'icône loupe si filtre secondaire actif
      const hasDrawerFilter = query !== "" || sourceFilter !== "ALL" || periodFilter !== "ALL";
      document.getElementById("drawer-dot").classList.toggle("hidden", !hasDrawerFilter);

      const filtered = allArticles.filter(art => {
        const artImpact = (art.impact || "INFORMATIF").toUpperCase();
        if (state.category !== "ALL" && art.category !== state.category) return false;
        if (state.impact !== "ALL" && artImpact !== state.impact) return false;
        if (sourceFilter !== "ALL" && art.source !== sourceFilter) return false;
        if (state.unreadOnly && state.readIds.includes(art.link)) return false;
        if (state.savedOnly && !state.savedIds.includes(art.link)) return false;

        if (periodFilter !== "ALL" && art.pub_date) {
          const pubTime = new Date(art.pub_date).getTime();
          if (!isNaN(pubTime)) {
            const ageHours = (now - pubTime) / (1000 * 3600);
            if (periodFilter === "24H" && ageHours > 24) return false;
            if (periodFilter === "7D" && ageHours > 168) return false;
          }
        }

        if (query) {
          const haystack = `${art.title} ${art.summary || ""} ${art.source}`.toLowerCase();
          if (!haystack.includes(query)) return false;
        }

        return true;
      });

      const hasAnyFilter = state.category !== "ALL" || state.impact !== "ALL" || state.unreadOnly || state.savedOnly || hasDrawerFilter;
      document.getElementById("reset-btn").classList.toggle("hidden", !hasAnyFilter);
      document.getElementById("results-count").textContent = `${filtered.length} article${filtered.length > 1 ? "s" : ""}`;

      renderCards(filtered);
    }

    function formatRelativeDate(dateStr) {
      if (!dateStr) return "";
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return "";
      const diffHours = Math.floor((Date.now() - date.getTime()) / (1000 * 3600));
      if (diffHours < 1) return "À l'instant";
      if (diffHours < 24) return `${diffHours}h`;
      const diffDays = Math.floor(diffHours / 24);
      if (diffDays === 1) return "Hier";
      if (diffDays < 7) return `${diffDays}j`;
      return date.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    }

    function toggleRead(link) {
      if (state.readIds.includes(link)) {
        state.readIds = state.readIds.filter(id => id !== link);
      } else {
        state.readIds.push(link);
      }
      localStorage.setItem("vj_read_ids", JSON.stringify(state.readIds));
      applyFilters();
    }

    function toggleSaved(link) {
      if (state.savedIds.includes(link)) {
        state.savedIds = state.savedIds.filter(id => id !== link);
      } else {
        state.savedIds.push(link);
      }
      localStorage.setItem("vj_saved_ids", JSON.stringify(state.savedIds));
      applyFilters();
    }

    function renderCards(articles) {
      const container = document.getElementById("articles-container");
      if (articles.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-10 text-center border border-slate-200/80">
            <p class="text-slate-500 text-sm">Aucun article pour cette sélection.</p>
            <button onclick="resetAllFilters()" class="mt-3 text-xs font-semibold text-sky-600 hover:underline">
              Réinitialiser les filtres
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = articles.map(art => {
        const cat = CATEGORIES[art.category] || CATEGORIES.AUTRE;
        const impact = (art.impact || "INFORMATIF").toUpperCase();
        const isRead = state.readIds.includes(art.link);
        const isSaved = state.savedIds.includes(art.link);
        const encodedLink = encodeURIComponent(art.link);

        let impactTag = "";
        if (impact === "CRITIQUE") {
          impactTag = `<span class="text-[10px] font-bold uppercase tracking-wider text-red-600 bg-red-50 px-2 py-0.5 rounded-full">Critique</span>`;
        } else if (impact === "IMPORTANT") {
          impactTag = `<span class="text-[10px] font-semibold uppercase tracking-wider text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full">Important</span>`;
        }

        return `
          <article class="bg-white rounded-2xl border border-slate-200/80 p-4 transition ${isRead ? "opacity-55" : "shadow-[0_1px_2px_rgba(0,0,0,0.03)]"}">
            
            <!-- Ligne supérieure épurée : Catégorie • Source • Date + Tag impact -->
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="flex items-center gap-1.5 text-[11px] text-slate-500 min-w-0">
                <span class="w-2 h-2 rounded-full ${cat.dot} shrink-0"></span>
                <span class="font-medium text-slate-700 shrink-0">${cat.label}</span>
                <span>•</span>
                <span class="truncate">${art.source}</span>
                <span>•</span>
                <span class="shrink-0">${formatRelativeDate(art.pub_date)}</span>
              </div>
              ${impactTag}
            </div>

            <!-- Titre -->
            <h2 class="text-[15.5px] font-semibold text-slate-900 leading-snug mb-2">
              <a href="${art.link}" target="_blank"
                 onclick="if(!state.readIds.includes(decodeURIComponent('${encodedLink}'))) toggleRead(decodeURIComponent('${encodedLink}'))"
                 class="hover:text-sky-600 transition">
                ${art.title}
              </a>
            </h2>

            <!-- Synthèse fluide sans boîte grise -->
            ${art.summary ? `
              <p class="text-[13.5px] text-slate-600 leading-relaxed mb-3">
                ${art.summary}
              </p>
            ` : ""}

            <!-- Pied de carte minimaliste -->
            <div class="flex items-center justify-between pt-2.5 border-t border-slate-100">
              <a href="${art.link}" target="_blank"
                 onclick="if(!state.readIds.includes(decodeURIComponent('${encodedLink}'))) toggleRead(decodeURIComponent('${encodedLink}'))"
                 class="text-xs font-medium text-slate-500 hover:text-slate-900 transition">
                Source officielle ↗
              </a>

              <div class="flex items-center gap-1">
                <button onclick="toggleRead(decodeURIComponent('${encodedLink}'))"
                  class="px-2.5 py-1 rounded-lg text-xs font-medium transition ${
                    isRead
                      ? "text-emerald-600 bg-emerald-50/80"
                      : "text-slate-400 hover:text-slate-700 hover:bg-slate-100"
                  }">
                  ${isRead ? "✓ Lu" : "Marquer lu"}
                </button>

                <button onclick="toggleSaved(decodeURIComponent('${encodedLink}'))"
                  class="p-1.5 rounded-lg transition ${
                    isSaved ? "text-amber-500" : "text-slate-300 hover:text-slate-600"
                  }" title="Sauvegarder">
                  <svg class="w-4 h-4" fill="${isSaved ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                  </svg>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    loadArticles();
  </script>
</body>
</html>
