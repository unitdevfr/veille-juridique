name: Veille Juridique Quotidienne

on:
  schedule:
    # 07h30 UTC = 08h30 heure française (heure d'hiver CET) du lundi au vendredi
    - cron: '48 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Exécuter la veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py

      - name: Sauvegarder l'historique SQLite et le flux PWA
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add veille_history.db docs/articles.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto: màj historique veille et flux PWA [skip ci]"
            git pull --rebase
            git push
          else
            echo "Aucune nouvelle donnée à enregistrer."
          fi
